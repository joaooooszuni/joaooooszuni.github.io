<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - OAuth</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 12px 0; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; text-decoration: none; color: white; font-weight: bold; box-sizing: border-box; }
        .btn-google { background-color: #db4437; }
        .btn-github { background-color: #24292e; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Painel de Acesso</h2>
        <p>Escolha um dos serviços para entrar:</p>
        <!-- Exemplo correto: apontando para as rotas OAuth -->
        <a href="https://github.com/login/oauth/authorize?client_id=Ov23liox9Kyu2fNn8OI2&redirect_uri=https://joaooooszuni-github-io.pages.dev/api/auth/github/callback&scope=read:user%20user:email">Entrar com GitHub</a>
        <a href="https://accounts.google.com/o/oauth2/v2/auth?client_id=1088358011801-95rj13vih4g7rqnas95toh23psdavg5p.apps.googleusercontent.com&redirect_uri=https://joaooooszuni-github-io.pages.dev/api/auth/google/callback&response_type=code&scope=openid%20email%20profile">Entrar com Google</a>
    </div>
</body>
</html>
